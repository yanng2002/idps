# Chargement du module UDP
module(load="imudp")
input(type="imudp" port="514")

# Filterlog (pare-feu pfSense)  local0
if $syslogfacility-text == 'local0' then /var/log/pfsense_filterlog.log
& stop

# Suricata EVE JSON + nginx (tout le local5)  même fichier
# Le filtrage se fera côté Python (lignes JSON uniquement)
if $syslogfacility-text == 'local5' then /var/log/pfsense_remote.log
& stop
